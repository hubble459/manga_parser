[package]
name = "manga_parser"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0", features = ["serde"] }
config = { version = "0", features = ["yaml", "toml", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_regex = "1"
regex = "1"
notify = { version = "8", optional = true }
kuchiki = { git = "https://github.com/hubble459/kuchiki-pseudos.git" }
thiserror = "2"
lazy_static = "1"
tokio = "1"
futures = "0"
async-trait = "0"
itertools = "0"
convert_case = "0"
reqwest = { version = "0.12", features = ["cookies", "json"] }
http-cache-reqwest = "0"
include_dir = "0.7"
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
fake_user_agent = "0"
task-local-extensions = "0"
anyhow = "1"
log = "0"
simple-builder = { git = "https://github.com/hubble459/simple-builder.git" }
strum = { version = "0.28", features = ["derive"] }
mangadex-api = "4.2"
mangadex-api-types-rust = "1.0"
mangadex-api-schema-rust = "1.1"
uuid = { version = "1.8", features = ["serde", "v4"] }

[features]
default = ["serde", "debug", "watch_dir"]
serde = []
debug = []
watch_dir = ["dep:notify"]

[dev-dependencies]
env_logger = "0"
test-log = { version = "*", features = ["log"] }
