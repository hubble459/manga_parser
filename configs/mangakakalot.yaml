# yaml-language-server: $schema=../schema/config.schema.yaml
name: mangakakalot

accept:
  hostnames:
    - mangakakalot.gg
    - www.mangakakalot.gg
    - kakamanga.com
    - www.kakamanga.com

manga:
  title:
    selector: div.story-info-right h1, ul.manga-info-text li:first-child h1
    options:
      fix_capitalization: title
  description:
    selector: "div.panel-story-info-description, #contentBox"
    options:
      text_selection:
        type: own-text
  cover_url:
    selector: "meta[property='og:image'], div.manga-info-pic img"
    options:
      text_selection:
        type: attributes
        attributes:
          - content
          - src
  status:
    selector: td:has('i.info-status') + td, ul.manga-info-text li:nth-child(3)
    options:
      cleanup:
        - replace_regex: "^Status : "
          replace_with: ""
  authors:
    selector: td:has('i.info-author') + td a, ul.manga-info-text li:nth-child(2)
    options:
      cleanup:
        - replace_regex: '^Author\(s\)\s*:\s*'
          replace_with: ""
        # The site's placeholder for a missing author.
        - replace_regex: '^Unknown$'
          replace_with: ""
      fix_capitalization: title
  genres:
    selector: td:has('i.info-author') + td a, ul.manga-info-text li.genres a
    options:
      cleanup:
        - replace_regex: "(^\\s+)|(\\s+$)"
          replace_with: " "
      fix_capitalization: title
  alt_titles:
    selector: td.table-label:icontains("alternative") + td h2
    options:
      text_split_regex: " ; "
      fix_capitalization: title

  chapter:
    base:
      - ul.row-content-chapter li, div.chapter-list div.row
      - div.json-item
    title:
      - a
      - selector: div.json-item
        options:
          text_selection:
            type: attributes
            attributes:
              - data-chapter_name
    url:
      - selector: a
        options:
          text_selection:
            type: attributes
            attributes:
              - href
              - src
      - selector: div.json-item
        options:
          text_selection:
            type: attributes
            attributes:
              - data-__url
    number:
      - selector: div.json-item
        options:
          text_selection:
            type: attributes
            attributes:
              - data-chapter_num
    date:
      - selector: span:last-child
        options:
          text_selection:
            type: attributes
            attributes:
              - title
      - selector: div.json-item
        options:
          text_selection:
            type: attributes
            attributes:
              - data-updated_at
    # The chapter list is loaded by JS from a JSON API keyed by the manga's slug.
    fetch_external:
      - id:
          selector: "#chapter-list-container"
          options:
            text_selection:
              type: attributes
              attributes:
                - data-comic-slug
        regex: "(?<id>.+)"
        url: /api/manga/{id}/chapters?limit=500
        json_array: /data/chapters
        json_url_template: "{url}/{chapter_slug}"
        # The API returns at most 999 chapters per request.
        json_pagination:
          offset_param: offset
          has_more: /data/pagination/has_more
images:
  image_selector:
    selector: div.container-chapter-reader img
    options:
      text_selection:
        type: attributes
        attributes:
          - src
          - data-src
      text_split_regex: null

search:
  - hostnames:
      - www.mangakakalot.gg
      - kakamanga.com
      - www.kakamanga.com
    # /search/story/{query} sits behind a Cloudflare challenge; the live-search
    # endpoint renders the same results page without one.
    search_url: "{hostname}/home/search/json?searchword={query}"
    query_format:
      - replace_regex: " "
        replace_with: "_"
      - replace_regex: '\W'
        replace_with: ""
    selectors:
      base: div.search-story-item, div.story_item
      url:
        selector: h3.story_name a
        options:
          text_selection:
            type: attributes
            attributes:
              - href
              - src
      title:
        selector: h3.story_name a
        options:
          fix_capitalization: title
      cover_url:
        selector: a:first-child img
        options:
          text_selection:
            type: attributes
            attributes:
              - src
              - data-src
      posted:
        selector: div.story_item_right span:icontains("updated")
        options:
          cleanup:
            - replace_regex: "Updated : "
              replace_with: ""

date_formats:
  - "%b-%d-%Y %R"
  - "%b %d,%Y %R"
  - "%b %d,%Y - %R"
