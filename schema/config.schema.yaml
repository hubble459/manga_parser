$id: config.schema.yaml
title: Manga Scraper
description: A manga scraper configuration
type: object
required:
  - name
  - accept
  - manga
properties:
  name:
    type: string
  accept:
    type: object
    properties:
      selectors:
        type: array
        items:
          type: string
      hostnames:
        type: array
        items:
          type: string
  manga:
    $ref: "#/$defs/manga"
  search:
    $ref: "#/$defs/search"
  images:
    type: object
    properties:
      image_selector:
        $ref: array_selector.schema.yaml
      fetch_external:
        $ref: "#/$defs/fetch_external"
      embedded_json:
        $ref: "#/$defs/embedded_json"
      pages:
        description: For paged readers (one image per page) - selects the URL of every reader page; image_selector then runs against each fetched page
        $ref: array_selector.schema.yaml
  date_formats:
    type: array
    description: Date formats the website uses based on https://docs.rs/chrono/latest/chrono/format/strftime/index.html
    uniqueItems: true
    items:
      type: string
$defs:
  manga:
    description: Scraper queries for a manga homepage
    type: object
    required:
      - title
      - description
      - chapter
    properties:
      title:
        $ref: string_selector.schema.yaml
      description:
        $ref: string_selector.schema.yaml
      cover_url:
        $ref: string_selector.schema.yaml
      status:
        $ref: string_selector.schema.yaml
      authors:
        $ref: array_selector.schema.yaml
      genres:
        $ref: array_selector.schema.yaml
      alt_titles:
        $ref: array_selector.schema.yaml
      chapter:
        $ref: "#/$defs/chapter"
  chapter:
    type: object
    required:
      - base
      - url
      - title
    properties:
      base:
        $ref: string_selector.schema.yaml
      title:
        $ref: string_selector.schema.yaml
      number:
        $ref: string_selector.schema.yaml
      date:
        $ref: string_selector.schema.yaml
      url:
        $ref: string_selector.schema.yaml
      fetch_external:
        $ref: "#/$defs/fetch_external"
      embedded_json:
        $ref: "#/$defs/embedded_json"
  embedded_json:
    type: object
    description:
      Page state embedded in the document itself (a <script> holding JSON),
      for sites whose HTML only renders part of the data. The array at
      `array` is flattened into synthetic <div class="json-item"> elements
      exactly like fetch_external's json_array, and the selectors then run
      against those.
    required:
      - selector
    properties:
      selector:
        type: string
        description: CSS selector for the element holding the serialized state
        examples:
          - script#it-astro-state
      unpack:
        enum:
          - packer
        description:
          Decode the element's text before format reads it. packer is Dean
          Edwards' eval(function(p,a,c,k,e,d)...) JavaScript packer.
      format:
        default: json
        enum:
          - json
          - devalue
          - regex
        description:
          devalue is application/json+devalue, as used by Astro and
          SvelteKit. regex pulls items out of any other text with
          item_regex.
      array:
        type: string
        default: ""
        description:
          RFC 6901 JSON Pointer to the array within the decoded state ("/"
          in a key is escaped as "~1"). Defaults to the root.
      item_regex:
        type: string
        description:
          Only for format regex. Matched against the element's text; each
          match becomes one item whose fields are the named groups.
        examples:
          - 'slug:"(?<slug>chapter-[^"]+)",number:(?<number>[\d.]+)'
      url_template:
        type: string
        description: Same as fetch_external's json_url_template
  fetch_external:
    type: array
    items:
      type: object
      required:
        - id
        - regex
        - url
      properties:
        id:
          $ref: string_selector.schema.yaml
        regex:
          type: string
          description:
            Regex should return a group called id which is used in
            the url
        url:
          type: string
          description:
            URL where chapters are hosted. Will replace {id} with id
            found from regex
        method:
          default: get
          enum:
            - get
            - post
        json_array:
          type: string
          description:
            RFC 6901 JSON Pointer (e.g. "/data/chapters") to an array
            within the fetched response. When set, the response is parsed
            as JSON instead of HTML; each array element is flattened into a
            synthetic `<div class="json-item">` element with one data-<key>
            attribute per scalar field (a plain value becomes data-value), so
            existing selectors below can read them via text_selection
            type "attributes" as normal.
        json_url_template:
          type: string
          description:
            Only used together with json_array, for JSON APIs that don't
            already include a directly usable URL/path. A template string
            using {host}/{url} (same as the url field above) plus
            {<field>} placeholders for this item's own flattened fields.
            The computed result is exposed as attribute data-__url.
  search:
    type: array
    items:
      type: object
      required:
        - hostnames
        - search_url
        - selectors
      properties:
        hostnames:
          type: array
          items:
            type: string
        search_url:
          type: string
          examples:
            - '"{host}/search?q={query}"'
        method:
          type: string
          enum:
            - get
            - post
          default: get
        body:
          type: string
          description:
            Optional request body, with {query} substituted (after
            query_format). Sent as described by body_format.
          examples:
            - '"action=wp-manga-search-manga&title={query}"'
            - '''{"q":"{query}","page":1}'''
        body_format:
          default: form
          enum:
            - form
            - json
          description:
            form sends body as application/x-www-form-urlencoded; json sends
            it as application/json, with {query} JSON-escaped so it can sit
            inside a JSON string.
        query_format:
          $ref: 'string_selector.schema.yaml#$defs/cleanup'
        json_array:
          type: string
          description:
            RFC 6901 JSON Pointer (e.g. "/data/results") to an array
            within the fetched search response. When set, the response is
            parsed as JSON instead of HTML and flattened into synthetic
            elements the same way as fetch_external's json_array does.
        json_url_template:
          type: string
          description:
            Only used together with json_array. See fetch_external's
            json_url_template for the placeholder syntax.
        selectors:
          type: object
          required:
            - base
            - url
            - title
          properties:
            base:
              $ref: string_selector.schema.yaml
            url:
              $ref: string_selector.schema.yaml
            title:
              $ref: string_selector.schema.yaml
            cover_url:
              $ref: string_selector.schema.yaml
            posted:
              $ref: string_selector.schema.yaml
