$id: config.schema.yaml
title: Manga Scraper
description: A manga scraper configuration
type: object
required:
  - name
  - accept
  - manga
properties:
  name:
    type: string
  accept:
    type: object
    properties:
      selectors:
        type: array
        items:
          type: string
      hostnames:
        type: array
        items:
          type: string
  manga:
    $ref: "#/$defs/manga"
  search:
    $ref: "#/$defs/search"
  images:
    type: object
    properties:
      image_selector:
        $ref: array_selector.schema.yaml
      fetch_external:
        $ref: "#/$defs/fetch_external"
  date_formats:
    type: array
    description: Date formats the website uses based on https://docs.rs/chrono/latest/chrono/format/strftime/index.html
    uniqueItems: true
    items:
      type: string
$defs:
  manga:
    description: Scraper queries for a manga homepage
    type: object
    required:
      - title
      - description
      - chapter
    properties:
      title:
        $ref: string_selector.schema.yaml
      description:
        $ref: string_selector.schema.yaml
      cover_url:
        $ref: string_selector.schema.yaml
      status:
        $ref: string_selector.schema.yaml
      authors:
        $ref: array_selector.schema.yaml
      genres:
        $ref: array_selector.schema.yaml
      alt_titles:
        $ref: array_selector.schema.yaml
      chapter:
        $ref: "#/$defs/chapter"
  chapter:
    type: object
    required:
      - base
      - url
      - title
    properties:
      base:
        $ref: string_selector.schema.yaml
      title:
        $ref: string_selector.schema.yaml
      number:
        $ref: string_selector.schema.yaml
      date:
        $ref: string_selector.schema.yaml
      url:
        $ref: string_selector.schema.yaml
      fetch_external:
        $ref: "#/$defs/fetch_external"
  fetch_external:
    type: array
    items:
      type: object
      required:
        - id
        - regex
        - url
      properties:
        id:
          $ref: string_selector.schema.yaml
        regex:
          type: string
          description:
            Regex should return a group called id which is used in
            the url
        url:
          type: string
          description:
            URL where chapters are hosted. Will replace {id} with id
            found from regex
        method:
          default: get
          enum:
            - get
            - post
        json_array:
          type: string
          description:
            RFC 6901 JSON Pointer (e.g. "/data/chapters") to an array
            within the fetched response. When set, the response is parsed
            as JSON instead of HTML: each array element (must be a JSON
            object) is flattened into a synthetic `<div class="json-item">`
            element with one data-<key> attribute per scalar field, so
            existing selectors below can read them via text_selection
            type "attributes" as normal.
        json_url_template:
          type: string
          description:
            Only used together with json_array, for JSON APIs that don't
            already include a directly usable URL/path. A template string
            using {host}/{url} (same as the url field above) plus
            {<field>} placeholders for this item's own flattened fields.
            The computed result is exposed as attribute data-__url.
  search:
    type: array
    items:
      type: object
      required:
        - hostnames
        - search_url
        - selectors
      properties:
        hostnames:
          type: array
          items:
            type: string
        search_url:
          type: string
          examples:
            - '"{host}/search?q={query}"'
        query_format:
          $ref: 'string_selector.schema.yaml#$defs/cleanup'
        json_array:
          type: string
          description:
            RFC 6901 JSON Pointer (e.g. "/data/results") to an array
            within the fetched search response. When set, the response is
            parsed as JSON instead of HTML and flattened into synthetic
            elements the same way as fetch_external's json_array does.
        json_url_template:
          type: string
          description:
            Only used together with json_array. See fetch_external's
            json_url_template for the placeholder syntax.
        selectors:
          type: object
          required:
            - base
            - url
            - title
          properties:
            base:
              $ref: string_selector.schema.yaml
            url:
              $ref: string_selector.schema.yaml
            title:
              $ref: string_selector.schema.yaml
            cover_url:
              $ref: string_selector.schema.yaml
            posted:
              $ref: string_selector.schema.yaml
